<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1f2740"/>
      <stop offset="60%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#060810"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="35%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#7b5af1"/>
      <stop offset="100%" stop-color="#b580ff"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#62e6ff"/>
      <stop offset="50%" stop-color="#8d68ff"/>
      <stop offset="100%" stop-color="#c48aff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="64" cy="64" r="63" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing border ring -->
  <circle cx="64" cy="64" r="60.5" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.9"/>
  
  <!-- Subtle inner ambient halo -->
  <circle cx="64" cy="64" r="44" fill="#7b5af1" opacity="0.12" filter="url(#glow)"/>

  <!-- GAU Hexagonal Shield Mark -->
  <g transform="translate(64,60) scale(1.15) translate(-32,-34)">
    <path d="M32 4 L56 18 L56 46 L32 60 L8 46 L8 18 Z" 
          stroke="url(#markGrad)" 
          stroke-width="3.5" 
          fill="rgba(123, 90, 241, 0.15)"
          stroke-linejoin="round"
          filter="url(#glow)"/>
    
    <!-- Central Core Geometry -->
    <path d="M20 36 L32 15 L44 36 L32 49 Z" 
          fill="url(#markGrad)" 
          fill-opacity="0.32" 
          stroke="url(#markGrad)" 
          stroke-width="2.5"
          stroke-linejoin="round"/>
          
    <circle cx="32" cy="34" r="5" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="32" cy="34" r="2.5" fill="#060810"/>
  </g>

  <!-- GAU v5 subtle bottom label pill -->
  <g transform="translate(64, 107)">
    <rect x="-24" y="-7" width="48" height="14" rx="7" fill="#080c18" stroke="url(#ringGrad)" stroke-width="1.2"/>
    <text x="0" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">GAU v5</text>
  </g>
</svg>
