<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=site/" />
  <meta name="robots" content="noindex, follow" />
  <title>GAU v5 | Redirecionando...</title>
  <link rel="canonical" href="site/" />
  <script>
    (function() {
      var path = window.location.pathname;
      if (!path.endsWith('/')) {
        path = path + '/';
      }
      var target = path + "site/" + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
  <style>
    :root {
      --bg: #080b12;
      --card-bg: #0e1424;
      --text: #e2e8f0;
      --muted: #798ba7;
      --accent: #5eead4;
      --accent-glow: rgba(94, 234, 212, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .redirect-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }
    .pulse-dot {
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 16px var(--accent-glow);
      animation: pulse 1.6s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 0.5; }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #fff;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: #151e36;
      color: var(--accent);
      border: 1px solid rgba(94, 234, 212, 0.35);
      border-radius: 8px;
      padding: 0.65rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(94, 234, 212, 0.15);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="pulse-dot"></div>
    <h1>Carregando GAU v5...</h1>
    <p>Redirecionando automaticamente para a interface do sistema.</p>
    <p><a class="btn" href="site/">Acessar site diretamente &rarr;</a></p>
  </div>
</body>
</html>
