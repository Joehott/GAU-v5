name: GAU v5 CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Build, Validate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run GAU Doctor
        run: python .gau/runtime/gau.py doctor

      - name: Run Unit Tests
        run: python -m unittest discover -s GAU-v5/tests

      - name: Package Release
        run: python tools/package_release.py

      - name: Run Deployment Tests
        run: python tools/test_deployment.py
